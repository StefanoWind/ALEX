# Config for power outage vs. meteorology analysis (AWAKEN site A1)

# User controls
prelim_rf: false
shap: false

# Data
source: data/siteA1_met_outages_15min_v2.nc
datetime_col: time
target_col: outages
predictor_cols:
  - wind_speed
  - temperature
  - relative_humidity
  - pressure
  - shortwave_radiation

# Seasonal detrending
detrend_seasonal: true
detrend_window_days: 7
detrend_min_periods: 3
# "inplace": overwrite predictor columns with anomalies
# "anomaly": add <col>_anom columns, keep originals
detrend_mode: inplace

# Target
# "binary": predict outage yes/no (outage_threshold applied to target_col)
# "regression": predict target_col directly
mode: binary
outage_threshold: 37

# Lag and window settings (in time steps)
lag_list: [0, 1, 3, 6, 12, 18, 36, 72, 144]
window_list: [0, 6, 144, 288]
min_corr: 0.1

# Collinearity
collinearity_r_threshold: 0.85
collinearity_vif_threshold: 10.0
# "warn": report only  |  "drop": remove redundant features
collinearity_action: drop

# Random Forest
n_estimators: 500
max_features: sqrt
n_jobs: -1
random_state: 42
n_cv_folds: 5
importance_reps: 10

# Physical limits for QC (applied to predictor columns)
limits:
  wind_speed: [0, 20]
  wind_direction_uv: [0, 360]
  wind_direction_std: [0, 30]
  temperature: [-10, 45]
  relative_humidity: [0, 100]
  pressure: [90, 100]
  shortwave_radiation: [0, 0.2]

# Output
output_dir: data

# Graphics
n_bins: 50
perc_bins: [0.1, 99.9]
nrow: 1
ncol: 5
