# Config for synthetic data smoke test

# User controls
prelim_rf: false
shap: false

# Data (source unused; df generated by generate_synthetic_data)
target_col: outages
predictor_cols:
  - wind_speed
  - temperature
  - relative_humidity
  - pressure
  - shortwave_radiation

# Seasonal detrending (disabled for speed in tests)
detrend_seasonal: false
detrend_window_days: 7
detrend_min_periods: 3
detrend_mode: inplace

# Target
mode: binary
outage_threshold: 50

# Lag and window settings (reduced for speed)
lag_list: [0, 1, 3, 6, 12, 18, 36, 72, 144]
window_list: [0, 6]
min_corr: 0.1

# Collinearity
collinearity_r_threshold: 0.85
collinearity_vif_threshold: 10.0
collinearity_action: warn

# Random Forest (smaller for speed)
n_estimators: 100
max_features: sqrt
n_jobs: -1
random_state: 42
n_cv_folds: 3
importance_reps: 5

# Output
output_dir: data

# Graphics
n_bins: 50
perc_bins: [0.1, 99.9]
nrow: 1
ncol: 5
